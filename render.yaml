services:
  - type: web
    name: proyekta-portal-agencias
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PUBLIC_BASE_URL
        value: https://agencias.proyektaviajes.es
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MAIL_FROM_NAME
        value: PROYEKTA VIAJES
      - key: MAIL_FROM_EMAIL
        value: jon@proyektaviajes.es
      - key: MAIL_REPLY_TO
        value: reservas@proyektaviajes.es
      - key: CONTRACT_NOTIFY_EMAIL
        value: reservas@proyektaviajes.es
      - key: RESEND_API_KEY
        sync: false
      - key: PRIVATE_NETWORK_ENABLED
        value: "false"
      - key: TS_AUTHKEY
        sync: false
      - key: NAS_WEBDAV_URL
        value: https://100.91.23.41:5006/Proyekta_Agencias/
      - key: NAS_WEBDAV_USERNAME
        value: Proyekta_portal
      - key: NAS_WEBDAV_PASSWORD
        sync: false
      - key: NAS_WEBDAV_CA_CERT
        sync: false
      - key: NAS_WEBDAV_TLS_SERVERNAME
        sync: false
